name: Platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: node --test scripts/check-secrets.test.cjs
      - run: node --test scripts/local-launch.test.cjs
      - run: node scripts/check-secrets.cjs --staged
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: proctolearn_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d proctolearn_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test-only-password@localhost:5432/proctolearn_security_test
      TEST_DATABASE_URL: postgresql://test:test-only-password@localhost:5432/proctolearn_security_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm test
      - run: npm run test:migrations
      - run: npx --no-install prisma migrate deploy
      - run: npm run test:integration
      # Upstream removed public images. Compile the pinned security release for this fixture only.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.8'
          cache: false
      - name: Build isolated S3 compatibility fixture
        run: |
          GOBIN="$RUNNER_TEMP/s3-bin" go install github.com/minio/minio@9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
      - name: Verify real object storage
        env:
          MINIO_ROOT_USER: integration-user
          MINIO_ROOT_PASSWORD: integration-storage-only
          TEST_MINIO_ENDPOINT: 127.0.0.1
          TEST_MINIO_PORT: 19000
          TEST_MINIO_ROOT_USER: integration-user
          TEST_MINIO_ROOT_PASSWORD: integration-storage-only
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/s3-bin/minio" server "$RUNNER_TEMP/s3-data" --address 127.0.0.1:19000 --console-address 127.0.0.1:19001 > "$RUNNER_TEMP/s3.log" 2>&1 &
          storage_pid=$!
          trap 'kill "$storage_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/ready; then
              npm run test:storage
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/s3.log"
          exit 1
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/local-launch.cjs --prepare-only
      - name: Build and start isolated local containers
        run: docker compose --project-name proctolearn-local --env-file .env.local -f docker-compose.local.yml up --detach --build --wait --wait-timeout 180
      - name: Verify application readiness and private object storage
        run: |
          curl --fail --silent http://localhost:4000/ready
          curl --fail --silent --output /dev/null http://localhost:3000
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:9000/)" = 403
      - name: Verify compiled demo seed with the container database configuration
        run: docker compose --project-name proctolearn-local --env-file .env.local -f docker-compose.local.yml exec -T -e ALLOW_DEMO_SEED=true -e RUN_MIGRATIONS=false api /bin/sh /app/docker/entrypoint.sh node dist/prisma/seed.js
      - name: Stop this job's containers
        if: always()
        run: docker compose --project-name proctolearn-local --env-file .env.local -f docker-compose.local.yml down
