name: Platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: node --test scripts/check-secrets.test.cjs
      - run: node scripts/check-secrets.cjs --staged
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: proctolearn_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d proctolearn_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test-only-password@localhost:5432/proctolearn_security_test
      TEST_DATABASE_URL: postgresql://test:test-only-password@localhost:5432/proctolearn_security_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm test
      - run: npm run test:migrations
      - run: npx --no-install prisma migrate deploy
      - run: npm run test:integration
      # Archived MinIO is an isolated compatibility fixture, not a production recommendation.
      - name: Start S3 compatibility fixture
        run: |
          docker run --detach --name proctolearn-storage-test \
            -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=integration-user \
            -e MINIO_ROOT_PASSWORD=integration-storage-only \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs proctolearn-storage-test
          exit 1
      - run: npm run test:storage
        env:
          TEST_MINIO_ENDPOINT: 127.0.0.1
          TEST_MINIO_PORT: 19000
          TEST_MINIO_ROOT_USER: integration-user
          TEST_MINIO_ROOT_PASSWORD: integration-storage-only
      - name: Stop S3 compatibility fixture
        if: always()
        run: docker rm --force proctolearn-storage-test || true
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
